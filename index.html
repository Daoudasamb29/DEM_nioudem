<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DEM — Ticket de Voyage Sénégal</title>
    <!-- Web App Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Meta Theme Color -->
    <meta name="theme-color" content="#0D1B4B" />
    <!-- Apple Mobile Web App Settings -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DEM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body class="bg-[#EEF2FF] text-[#0D1B4B]">
    <div id="root"></div>
    <!-- Clean Service Worker and Cache to prevent Blank Screen conflicts without infinite reload loop -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            registration.unregister().then((success) => {
              if (success) {
                console.log('Service Worker unregistered.');
              }
            });
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then((keys) => {
          for (let key of keys) {
            caches.delete(key);
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
